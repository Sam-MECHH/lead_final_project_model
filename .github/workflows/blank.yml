name: Lead Final Project CI Pipeline

on:
  #push:
  #  branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [trigger-training]
  workflow_dispatch:

jobs:
  # ==============================================================================
  # JOB 1: BUILD, TEST & PUSH (The "Artifact Factory")
  # ==============================================================================
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        # We tag it with the Commit SHA (for precise versioning) AND 'latest'
        run: |
          IMAGE_ID=${{ secrets.DOCKER_USERNAME }}/lead-final-proj-ml-workflow
          
          docker build -t $IMAGE_ID:${{ github.sha }} .
          docker tag $IMAGE_ID:${{ github.sha }} $IMAGE_ID:latest

      - name: Run Tests in Docker
        # We test the EXACT image we just built. 
        # If this fails, we never push to Docker Hub.
        run: |
          IMAGE_ID=${{ secrets.DOCKER_USERNAME }}/lead-final-proj-ml-workflow
          
          docker run --rm \
            $IMAGE_ID:${{ github.sha }} \
            python -m pytest tests/

      - name: Push to Docker Hub
        # Only push if tests passed AND we are on the main branch
        if: github.ref == 'refs/heads/main'
        run: |
          IMAGE_ID=${{ secrets.DOCKER_USERNAME }}/lead-final-proj-ml-workflow
          # This pushes the exact same image under two distinct labels, not two separate images.
          docker push $IMAGE_ID:${{ github.sha }}
          docker push $IMAGE_ID:latest
